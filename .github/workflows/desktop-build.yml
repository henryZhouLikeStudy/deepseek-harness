name: Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  build:
    name: Build Desktop Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # pnpm/action-setup is for pnpm v10 and older; v11+ needs the standalone
      # pnpm/setup action, which reads packageManager and installs the matching
      # self-contained binary. Keep install: false because we run pnpm install
      # in a dedicated step.
      - uses: pnpm/setup@v2
        with:
          install: false
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host and client libraries
        run: pnpm run build:lib

      - name: Build web frontend
        run: pnpm run build:web

      - name: Deploy dsh runtime
        env:
          # Inline workspace packages into the deploy target so the runtime is
          # self-contained. We keep the workspace-level setting disabled to
          # avoid stale copies and lock churn across the repo.
          pnpm_config_inject_workspace_packages: true
        run: pnpm --frozen-lockfile --config.node-linker=hoisted --config.link-workspace-packages=true --filter @deepseek-ai/dsh deploy --prod --ignore-scripts apps/desktop/dsh-runtime-staging

      - name: Materialize dsh runtime
        run: node scripts/materialize-desktop-runtime.mjs --from apps/desktop/dsh-runtime-staging --to apps/desktop/dsh-runtime --source-node-modules apps/cli/node_modules --fallback-node-modules node_modules --smoke-command "web --help"

      - name: Build desktop main process
        working-directory: apps/desktop
        env:
          # pnpm 11 runs `pnpm install --production` before scripts by default.
          # The earlier `pnpm deploy` leaves the workspace state out of sync, so
          # that auto-install would purge devDependencies and run root postinstall
          # before lefthook is available. Skip the implicit install; dependencies
          # were already installed by the explicit install step above.
          pnpm_config_verify_deps_before_run: false
        run: pnpm run build

      - name: Build desktop installer
        working-directory: apps/desktop
        env:
          # Same guard for any pnpm subprocess that electron-builder may spawn.
          pnpm_config_verify_deps_before_run: false
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: apps/desktop/dist/release/*.exe
          if-no-files-found: error
          retention-days: 7
