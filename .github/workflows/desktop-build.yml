name: Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  build:
    name: Build Desktop Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # pnpm/action-setup is for pnpm v10 and older; v11+ needs the standalone
      # pnpm/setup action, which reads packageManager and installs the matching
      # self-contained binary. Keep install: false because we run pnpm install
      # in a dedicated step.
      - uses: pnpm/setup@v2
        with:
          install: false
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build host and client libraries
        run: pnpm run build:lib

      - name: Build web frontend
        run: pnpm run build:web

      - name: Deploy dsh runtime
        run: pnpm --filter @deepseek-ai/dsh deploy --prod --legacy --ignore-scripts apps/desktop/dsh-runtime

      - name: Build desktop main process
        working-directory: apps/desktop
        run: pnpm run build

      - name: Build desktop installer
        working-directory: apps/desktop
        run: npx electron-builder --win nsis

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-installer
          path: apps/desktop/dist/release/*.exe
          if-no-files-found: error
          retention-days: 7
