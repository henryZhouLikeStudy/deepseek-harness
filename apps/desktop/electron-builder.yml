appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist/release
files:
  - dist/main.js
  - package.json
extraResources:
  - from: '../../apps/desktop/dsh-runtime/lib'
    to: 'apps/desktop/dsh-runtime/lib'
  - from: '../../apps/desktop/dsh-runtime/config'
    to: 'apps/desktop/dsh-runtime/config'
  - from: '../../apps/desktop/dsh-runtime/node_modules'
    to: 'apps/desktop/dsh-runtime/node_modules'
  - from: '../../apps/web/dist'
    to: 'apps/web/dist'
asar: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
