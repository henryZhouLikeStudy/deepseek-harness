appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist/release
files:
  - dist/main.js
  - package.json
extraResources:
  - from: '../../apps/cli/lib'
    to: 'apps/cli/lib'
  - from: '../../apps/cli/config'
    to: 'apps/cli/config'
  - from: '../../apps/cli/package.json'
    to: 'apps/cli/package.json'
  - from: '../../apps/web/dist'
    to: 'apps/web/dist'
  - from: '../../node_modules'
    to: 'node_modules'
asar: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
