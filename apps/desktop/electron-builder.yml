appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist/release
files:
  - dist/main.js
  - package.json
extraResources:
  - from: '../../apps/desktop/dsh-runtime'
    to: 'apps/desktop/dsh-runtime'
  - from: '../../apps/web/dist'
    to: 'apps/web/dist'
asar: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
